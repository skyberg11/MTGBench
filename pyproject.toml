[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "multiturn-games-benchmark"
version = "0.1.0"
description = "A bilingual benchmark for evaluating language models in controlled multi-turn games"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-DATA.md", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "MTGBench authors" }]
keywords = [
    "benchmark",
    "large-language-models",
    "multi-turn",
    "reasoning",
    "evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "nltk==3.9.3",
    "openai==2.29.0",
    "pandas==3.0.1",
    "python-dotenv==1.2.2",
    "requests==2.33.1",
    "ruwordnet==0.0.6",
    "sqlalchemy<2.0.0",
]

[project.optional-dependencies]
analysis = [
    "matplotlib==3.10.8",
    "nltk==3.9.3",
    "numpy==2.4.3",
    "scipy==1.17.1",
    "seaborn==0.13.2",
]
dataset-generation = [
    "nltk==3.9.3",
    "numpy==2.4.3",
]

[project.urls]
Homepage = "https://github.com/skyberg11/MTGBench"
Repository = "https://github.com/skyberg11/MTGBench.git"
Issues = "https://github.com/skyberg11/MTGBench/issues"

[project.scripts]
mtgbench = "main:main"

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE", "/LICENSE-DATA.md", "/README.md", "/THIRD_PARTY_NOTICES.md",
    "/main.py", "/models.json", "/multiturn_games_benchmark", "/pyproject.toml",
    "/analysis", "/dataset_generation", "/docs",
]
exclude = ["/analysis/outputs", "/multiturn_games_benchmark/datasets", "**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["multiturn_games_benchmark", "dataset_generation"]
exclude = ["/multiturn_games_benchmark/datasets", "**/__pycache__"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"models.json" = "models.json"
