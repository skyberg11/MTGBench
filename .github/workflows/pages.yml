name: GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'analysis/outputs/tables/**'
      - 'results/wordle/**'
      - 'results/baselines/wordle/ru_baseline.jsonl'
      - 'multiturn_games_benchmark/datasets/wordle/wordle_ru.jsonl'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python site/scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site-build
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
